<!DOCTYPE html>
<html lang="en">
<head>
    <title>Todo List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        .task-card {
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h1>Todo List</h1>

<input id="task-title" placeholder="Task Title">
<input id="task-note" placeholder="Task Note">

<button onclick="createTask()">
    Add Task
</button>

<button onclick="loadTasks()">
    Show All Tasks
</button>

<div id="tasks"></div>

<script>
    const API_URL = "/tasks";

    async function createTask() {
        const titleInput = document.getElementById("task-title");
        const title = titleInput.value.trim();

        const noteInput = document.getElementById("task-note");
        const note = noteInput.value.trim();

        if (title === "") {
            alert("Title is required");
            return;
        }

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                note: note,
                completed: false
            })
        });

        if (!response.ok) {
            alert("Failed to create task");
            return;
        }

        titleInput.value = "";
        noteInput.value = "";

        await loadTasks();
    }

    async function loadTasks() {
        const response = await fetch(API_URL);

        if (!response.ok) {
            alert("Failed to load tasks");
            return;
        }

        const tasks = await response.json();
        const tasksDiv = document.getElementById("tasks");

        tasksDiv.innerHTML = "";

        for (const task of tasks) {
            tasksDiv.innerHTML += "<div class='task-card'>";
            tasksDiv.innerHTML += "<strong>Title:</strong> " + task.title + "<br>";
            tasksDiv.innerHTML += "<strong>Note:</strong> " + task.note + "<br>";
            tasksDiv.innerHTML += "<strong>Completed:</strong> " + task.completed + "<br>";
            tasksDiv.innerHTML += "<button onclick=\"updateTask(" + task.id + ")\">Update</button>";
            tasksDiv.innerHTML += "<button onclick=\"deleteTask(" + task.id + ")\">Delete</button>";
            tasksDiv.innerHTML += "</div>";
        }
    }

    async function updateTask(taskId) {
        const newTitle = prompt("New title:");
        const newNote = prompt("New note:");
        const newCompletedText = prompt("Completed? true/false:");

        if (newTitle === null || newNote === null || newCompletedText === null) {
            return;
        }

        if (newTitle.trim() === "") {
            alert("Title is required");
            return;
        }

        if (newCompletedText !== "true" && newCompletedText !== "false") {
            alert("Completed must be true or false");
            return;
        }

        const response = await fetch(API_URL + "/" + taskId, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: newTitle.trim(),
                note: newNote.trim(),
                completed: newCompletedText === "true"
            })
        });

        if (!response.ok) {
            alert("Failed to update task");
            return;
        }

        await loadTasks();
    }

    async function deleteTask(taskId) {
        const response = await fetch(API_URL + "/" + taskId, {
            method: "DELETE"
        });

        if (!response.ok) {
            alert("Failed to delete task");
            return;
        }

        await loadTasks();
    }
</script>

</body>
</html>
