name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A new push to the same branch supersedes its older CI run.  This also
# prevents concurrent E2E jobs from competing for Docker resources.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: gpt-5-nano

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/todo_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/todo_test_db
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/todo_test_db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317

      FRONTEND_ORIGIN: http://localhost:3000

      JWT_SECRET_KEY: test-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
          pip install bandit

      - name: Run tests with coverage
        working-directory: backend
        run: |
          coverage run -m pytest
          coverage report --fail-under=80

      - name: Run Bandit
        working-directory: backend
        run: |
          bandit -r app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run unit and integration tests
        working-directory: frontend
        run: npm test

      - name: Generate frontend coverage report
        working-directory: frontend
        run: npm run test:coverage

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end tests
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # test:e2e builds the current images and starts only the dedicated
      # Compose stack; it never reuses the fast/stale-image mode in CI.
      - name: Run browser end-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 7
